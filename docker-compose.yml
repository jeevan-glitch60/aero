version: '3.8'

services:
  aerotwin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerotwin-digital-twin
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
